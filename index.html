<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Age calculator app</title>
    <meta
      name="description"
      content="data selector made with html css and js."
    />
    <!-- Feel free to remove these styles or customize in your own stylesheet 👍 -->
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main>
      <article class="age-calculator">
        <div class="form">
          <div class="inputs">
            <!-- day's -->
            <div class="input-group">
              <label for="day" id="label-day">Day</label>
              <input id="day" type="text" placeholder="DD" />
              <span class="error-message" id="day-error"></span>
              <span id="inputs"></span>
            </div>

            <!-- month's -->
            <div class="input-group">
              <label for="month" id="label-month">Month</label>
              <input id="month" type="text" placeholder="MM" />
              <span class="error-message" id="month-error"></span>
            </div>

            <!-- year's -->
            <div class="input-group">
              <label for="year" id="label-year">Year</label>
              <input id="year" type="text" placeholder="YYYY" />
              <span class="error-message" id="year-error"></span>
            </div>
          </div>
          <button
            type="submit"
            id="btn"
            class="btn-arrow"
            aria-label="Calculate age"
          >
            <img src="images/icon-arrow.svg" alt="" aria-hidden="true" />
          </button>
        </div>
        <div class="results">
          <p><span id="years">--</span> years</p>
          <p><span id="months">--</span> months</p>
          <p><span id="days">--</span> days</p>
        </div>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/MoMo97X"
        >Mohammed Arrujbani</a
      >
    </footer>
    <script src="index.js"></script>
  </body>
</html>
